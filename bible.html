<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {

        }

        .quiz-header {
            background: #2c5f2d;

        }

        .quiz-header h1 span {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .quiz-header p {
            margin-top: 0.5rem;
            font-style: italic;
            border-top: 1px solid #7da06e;
            display: inline-block;
            padding-top: 0.4rem;
        }

        /* stats bar */
        .stats-bar {
            background: #e8dfcc;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-bottom: 1px solid #cfc3a8;
            font-weight: 600;
            color: #3a2c1a;
        }

        .category-badge {
            background: #2c5f2d;
            color: #ffefc0;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
        }

        .score-badge {
            background: #c4a35a;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            color: #1e2a0e;
        }

        .progress-container {
            background: #d9ceb0;
            height: 6px;
            width: 100%;
        }

        .progress-fill {
            background: #2c5f2d;
            height: 6px;
            width: 0%;
            transition: width 0.3s;
        }

        /* main content */
        .quiz-body {
            padding: 2rem;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2a4825;
            margin-bottom: 1.5rem;
            line-height: 1.3;
            border-left: 5px solid #c4a35a;
            padding-left: 1rem;
        }

        .options-list {
            list-style: none;
            margin: 1rem 0 1.8rem;
        }

        .option-item {
            background: #fdfaf2;
            border: 1px solid #e2d5bc;
            border-radius: 60px;
            margin-bottom: 0.8rem;
            padding: 0.7rem 1.2rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-item:hover {
            background: #f6efdf;
            border-color: #b68b40;
            transform: translateX(4px);
        }

        .option-radio {
            width: 20px;
            height: 20px;
            margin-right: 1rem;
            accent-color: #2c5f2d;
            cursor: pointer;
        }

        .option-text {
            font-size: 1rem;
            color: #2c2b1f;
            cursor: pointer;
            flex: 1;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin: 1.5rem 0 1rem;
        }

        button {
            background: #e2d5bd;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        button.primary {
            background: #2c5f2d;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button.primary:hover {
            background: #1f4520;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .category-selector {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .category-selector select {
            background: #f4efdf;
            border: 1px solid #c4b28a;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
        }

        .reset-btn {
            background: #a8813a;
            color: white;
            font-size: 0.8rem;
        }

        .result-area {
            text-align: center;
            padding: 1rem;
        }

        .final-score-circle {
            background: #2c5f2d;
            color: #f7efc3;
            font-size: 3rem;
            font-weight: bold;
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 80px;
            margin: 1rem 0;
        }

        .message-final {
            background: #eee5d4;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            font-size: 1.1rem;
        }

        footer {
            background: #e8dfcc;
            text-align: center;
            padding: 0.8rem;
            font-size: 0.75rem;
            color: #5e4e2b;
            border-top: 1px solid #cfc3a8;
        }

        @media (max-width: 600px) {
            .quiz-body {
                padding: 1.2rem;
            }
            .question-text {
                font-size: 1.2rem;
            }
            .option-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

    // Application state
    let currentIndex = 0;
    let userSelections = new Array(QUIZ_DATA.length).fill(null);
    let quizFinished = false;
    let currentCategoryFilter = "all";

    // Helper: get unique categories
    function getAllCategories() {
        const cats = [...new Set(QUIZ_DATA.map(q => q.category))];
        return cats.sort();
    }

    function getFilteredIndices() {
        if (currentCategoryFilter === "all") {
            return Array.from({ length: QUIZ_DATA.length }, (_, i) => i);
        }
        return QUIZ_DATA.reduce((acc, q, idx) => {
            if (q.category === currentCategoryFilter) acc.push(idx);
            return acc;
        }, []);
    }

    function getCurrentDisplayIndex() {
        const filtered = getFilteredIndices();
        return filtered[currentIndex] !== undefined ? filtered[currentIndex] : (filtered[0] ?? 0);
    }

    function getTotalFiltered() {
        return getFilteredIndices().length;
    }

    function render() {
        const container = document.getElementById("dynamicContent");
        if (!container) return;

        if (quizFinished) {
            renderResultScreen(container);
            return;
        }

        const filteredIndices = getFilteredIndices();
        if (filteredIndices.length === 0) {
            container.innerHTML = `<div class="quiz-body"><p class="question-text">No questions in this category.</p><button id="resetCategoryBtn" class="reset-btn">Show All Categories</button></div>`;
            const btn = document.getElementById("resetCategoryBtn");
            if (btn) btn.onclick = () => { currentCategoryFilter = "all"; currentIndex = 0; render(); };
            return;
        }

        const realQIndex = filteredIndices[currentIndex];
        const question = QUIZ_DATA[realQIndex];
        const selectedVal = userSelections[realQIndex];
        const totalFiltered = filteredIndices.length;
        const answeredCount = userSelections.filter((val, idx) => val !== null && filteredIndices.includes(idx)).length;

        // Build options
        let optionsHtml = "";
        question.options.forEach((opt, optIdx) => {
            const isChecked = (selectedVal === optIdx);
            optionsHtml += `
                <li class="option-item" data-opt-index="${optIdx}">
                    <input type="radio" name="qOption" id="opt_${optIdx}" value="${optIdx}" class="option-radio" ${isChecked ? "checked" : ""}>
                    <label for="opt_${optIdx}" class="option-text">${escapeHtml(opt)}</label>
                </li>
            `;
        });

        const progressPercent = ((currentIndex + 1) / totalFiltered) * 100;
        const scoreSoFar = userSelections.reduce((acc, sel, idx) => {
            if (sel !== null && sel === QUIZ_DATA[idx].correct && filteredIndices.includes(idx)) acc++;
            return acc;
        }, 0);

        const categories = getAllCategories();
        const catOptions = categories.map(cat => `<option value="${cat}" ${currentCategoryFilter === cat ? "selected" : ""}>${cat}</option>`).join("");

        const html = `
            <div class="stats-bar">
                <span class="category-badge">📖 ${question.category}</span>
                <span class="score-badge">✅ Score: ${scoreSoFar} / ${totalFiltered}</span>
            </div>
            <div class="progress-container"><div class="progress-fill" style="width: ${progressPercent}%;"></div></div>
            <div class="quiz-body">
                <div class="category-selector">
                    <span>🏷️ Filter by category:</span>
                    <select id="categorySelect">
                        <option value="all">📚 All Categories</option>
                        ${catOptions}
                    </select>
                    <button id="resetProgressBtn" class="reset-btn">⟳ Reset All</button>
                </div>
                <div class="question-text">${escapeHtml(question.text)}</div>
                <ul class="options-list" id="optionsList">
                    ${optionsHtml}
                </ul>
                <div class="nav-buttons">
                    <button id="prevBtn" ${currentIndex === 0 ? "disabled" : ""}>◀ Previous</button>
                    <button id="nextBtn" class="primary">${currentIndex === totalFiltered - 1 ? "Finish Quiz" : "Next ▶"}</button>
                </div>
            </div>
        `;

        container.innerHTML = html;

        // attach events
        const radios = document.querySelectorAll('input[name="qOption"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const selected = parseInt(e.target.value);
                userSelections[realQIndex] = selected;
                render(); // re-render to show updated progress
            });
        });

        const optionItems = document.querySelectorAll('.option-item');
        optionItems.forEach(item => {
            item.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    const radio = item.querySelector('.option-radio');
                    if (radio) {
                        radio.checked = true;
                        radio.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                }
            });
        });

        document.getElementById('prevBtn')?.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        });
        document.getElementById('nextBtn')?.addEventListener('click', () => {
            if (currentIndex === totalFiltered - 1) {
                quizFinished = true;
                render();
            } else {
                if (currentIndex < totalFiltered - 1) {
                    currentIndex++;
                    render();
                }
            }
        });
        document.getElementById('categorySelect')?.addEventListener('change', (e) => {
            currentCategoryFilter = e.target.value;
            currentIndex = 0;
            render();
        });
        document.getElementById('resetProgressBtn')?.addEventListener('click', () => {
            userSelections = new Array(QUIZ_DATA.length).fill(null);
            currentIndex = 0;
            quizFinished = false;
            render();
        });
    }

    function renderResultScreen(container) {
        const filteredIndices = getFilteredIndices();
        let totalPossible = filteredIndices.length;
        let correctCount = 0;
        for (let idx of filteredIndices) {
            if (userSelections[idx] !== null && userSelections[idx] === QUIZ_DATA[idx].correct) correctCount++;
        }
        const percent = Math.round((correctCount / totalPossible) * 100);
        let message = "";
        if (percent === 100) message = "🌟 Perfect! You truly know the Word! 🌟";
        else if (percent >= 80) message = "📖 Excellent! A student of Scripture!";
        else if (percent >= 60) message = "👍 Good effort! Keep studying God's Word.";
        else message = "🌱 Keep reading your Bible — growth comes with time!";

        const categories = getAllCategories();
        const catOptions = categories.map(cat => `<option value="${cat}" ${currentCategoryFilter === cat ? "selected" : ""}>${cat}</option>`).join("");

        const html = `
            <div class="stats-bar"><span>🏆 Quiz Complete 🏆</span><span>📊 ${correctCount}/${totalPossible}</span></div>
            <div class="quiz-body result-area">
                <div class="category-selector">
                    <span>🏷️ Category:</span>
                    <select id="resultCategorySelect">
                        <option value="all">📚 All Categories</option>
                        ${catOptions}
                    </select>
                    <button id="restartFromResultBtn" class="reset-btn">⟳ New Quiz</button>
                </div>
                <div class="final-score-circle">${correctCount} / ${totalPossible}</div>
                <div style="font-size:1.3rem;">${percent}% accuracy</div>
                <div class="message-final">${message}</div>
                <button id="retakeBtn" class="primary" style="padding:0.8rem 2rem;">📖 Take Quiz Again</button>
            </div>
        `;
        container.innerHTML = html;

        document.getElementById("resultCategorySelect")?.addEventListener('change', (e) => {
            currentCategoryFilter = e.target.value;
            currentIndex = 0;
            quizFinished = false;
            render();
        });
        document.getElementById("restartFromResultBtn")?.addEventListener('click', () => {
            userSelections = new Array(QUIZ_DATA.length).fill(null);
            currentIndex = 0;
            quizFinished = false;
            render();
        });
        document.getElementById("retakeBtn")?.addEventListener('click', () => {
            userSelections = new Array(QUIZ_DATA.length).fill(null);
            currentIndex = 0;
            quizFinished = false;
            render();
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // start
    render();
</script>
</body>
</html>
